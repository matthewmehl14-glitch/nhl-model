name: NHL Grader

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-repo-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Grade plays
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python nhl_grader.py
      - name: Commit graded log
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          [ -f nhl_plays_log.csv ] && git add nhl_plays_log.csv
          git diff --cached --quiet || (git commit -m "NHL grader run" && git push)
